# /etc/nginx/sites-available/ecoenergy
# Nginx recibe las peticiones en el puerto 80, sirve directamente los
# archivos estáticos y subidos, y deriva el resto a Gunicorn.
server {
    listen 80 default_server;
    server_name _;

    # La imagen admite 2 MB; se deja margen para el resto del formulario.
    client_max_body_size 5M;

    location /static/ {
        alias /home/ubuntu/ecoenergy/staticfiles/;
        expires 7d;
    }

    location /media/ {
        alias /home/ubuntu/ecoenergy/media/;
        # Los archivos subidos nunca se ejecutan ni se interpretan como HTML.
        add_header X-Content-Type-Options nosniff;
        types {
            image/jpeg jpg jpeg;
            image/png  png;
            image/webp webp;
        }
        default_type application/octet-stream;
    }

    location / {
        proxy_pass http://unix:/run/ecoenergy/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
