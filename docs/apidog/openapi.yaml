components:
  schemas:
    Alert:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        zone:
          type: integer
          readOnly: true
          title: Zona
        zone_name:
          type: string
          readOnly: true
        organization_name:
          type: string
          readOnly: true
        device:
          type: integer
          readOnly: true
          nullable: true
          title: Dispositivo
        device_name:
          type: string
          readOnly: true
        reading:
          type: integer
          readOnly: true
          nullable: true
          title: Lectura que la originó
        severity:
          type: integer
          readOnly: true
          title: Severidad
        severity_name:
          type: string
          readOnly: true
        severity_level:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
          title: Título
        description:
          type: string
          readOnly: true
          title: Descripción
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
          title: Estado
        status_display:
          type: string
          readOnly: true
        detected_at:
          type: string
          format: date-time
          readOnly: true
          title: Detectada el
        resolved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Resuelta el
      required:
      - description
      - detected_at
      - device
      - device_name
      - id
      - organization_name
      - reading
      - resolved_at
      - severity
      - severity_level
      - severity_name
      - status
      - status_display
      - title
      - zone
      - zone_name
    Category:
      type: object
      description: 'Base de los serializers con escritura: usuario actual y reglas
        del modelo.'
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Nombre
          maxLength: 100
        description:
          type: string
          title: Descripción
        is_active:
          type: boolean
          title: Activa
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Creado el
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Actualizado el
      required:
      - created_at
      - id
      - name
      - updated_at
    CategoryRequest:
      type: object
      description: 'Base de los serializers con escritura: usuario actual y reglas
        del modelo.'
      properties:
        name:
          type: string
          minLength: 1
          title: Nombre
          maxLength: 100
        description:
          type: string
          title: Descripción
        is_active:
          type: boolean
          title: Activa
      required:
      - name
    ConsumptionReading:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        device:
          type: integer
          readOnly: true
          title: Dispositivo
        device_name:
          type: string
          readOnly: true
        zone:
          type: integer
          readOnly: true
        zone_name:
          type: string
          readOnly: true
        organization_name:
          type: string
          readOnly: true
        reading_at:
          type: string
          format: date-time
          readOnly: true
          title: Fecha y hora de lectura
        consumption_kwh:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          title: Consumo (kWh)
        nominal_consumption_kwh:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        is_over_nominal:
          type: boolean
          readOnly: true
        notes:
          type: string
          readOnly: true
          title: Observaciones
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Creado el
      required:
      - consumption_kwh
      - created_at
      - device
      - device_name
      - id
      - is_over_nominal
      - nominal_consumption_kwh
      - notes
      - organization_name
      - reading_at
      - zone
      - zone_name
    Device:
      type: object
      description: 'Base de los serializers con escritura: usuario actual y reglas
        del modelo.'
      properties:
        id:
          type: integer
          readOnly: true
        zone:
          type: integer
        zone_name:
          type: string
          readOnly: true
        organization:
          type: integer
          readOnly: true
        organization_name:
          type: string
          readOnly: true
        name:
          type: string
          title: Nombre
          maxLength: 120
        serial_number:
          type: string
          title: Número de serie
          pattern: ^[A-Z0-9-]{4,40}$
          maxLength: 40
        category:
          type: integer
          title: Categoría
        category_name:
          type: string
          readOnly: true
        manufacturer:
          type: integer
          title: Fabricante
        manufacturer_name:
          type: string
          readOnly: true
        nominal_consumption_kwh:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          title: Consumo nominal (kWh)
          description: Consumo energético nominal del dispositivo en kWh (0,01 a 5.000).
        installed_on:
          type: string
          format: date
          title: Fecha de instalación
        is_active:
          type: boolean
          title: Activo
        image:
          type: string
          format: uri
          nullable: true
          readOnly: true
          title: Imagen
          description: JPG, PNG o WEBP. Máximo 2 MB.
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Creado el
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Actualizado el
      required:
      - category
      - category_name
      - created_at
      - id
      - image
      - installed_on
      - manufacturer
      - manufacturer_name
      - name
      - nominal_consumption_kwh
      - organization
      - organization_name
      - serial_number
      - updated_at
      - zone
      - zone_name
    DeviceRequest:
      type: object
      description: 'Base de los serializers con escritura: usuario actual y reglas
        del modelo.'
      properties:
        zone:
          type: integer
        name:
          type: string
          minLength: 1
          title: Nombre
          maxLength: 120
        serial_number:
          type: string
          minLength: 1
          title: Número de serie
          pattern: ^[A-Z0-9-]{4,40}$
          maxLength: 40
        category:
          type: integer
          title: Categoría
        manufacturer:
          type: integer
          title: Fabricante
        nominal_consumption_kwh:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          title: Consumo nominal (kWh)
          description: Consumo energético nominal del dispositivo en kWh (0,01 a 5.000).
        installed_on:
          type: string
          format: date
          title: Fecha de instalación
        is_active:
          type: boolean
          title: Activo
      required:
      - category
      - installed_on
      - manufacturer
      - name
      - nominal_consumption_kwh
      - serial_number
      - zone
    Manufacturer:
      type: object
      description: 'Base de los serializers con escritura: usuario actual y reglas
