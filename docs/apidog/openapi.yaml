openapi: 3.0.3
info:
  title: EcoEnergy API REST
  version: 1.0.0
  description: 'API de monitoreo energético. Autenticación JWT: POST /api/token/ y
    header Authorization: Bearer <access>. Roles: Administrador API (lectura y escritura),
    Operador API (solo lectura); sin rol API -> 403. Scoping por organización: un
    registro de otra organización -> 404.'
paths:
  /api/alertas/:
    get:
      operationId: alertas_list
      description: Lista paginada de alertas (20 por página; ?page= y ?page_size=,
        máx. 100).
      summary: Listar alertas
      parameters:
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: 'Busca texto en: título, descripción.'
      - in: query
        name: status
        schema:
          type: string
          enum:
          - in_progress
          - open
          - resolved
        description: Solo alertas en este estado.
      tags:
      - alertas
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAlertList'
          description: ''
        '401':
          description: Sin token JWT, o token inválido o vencido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene rol API, o es Operador API e intenta escribir.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/alertas/{id}/:
    get:
      operationId: alertas_retrieve
      description: Alertas de consumo de la organización del usuario (solo lectura).
      summary: Ver alerta
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este alerta.
        required: true
      tags:
      - alertas
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
          description: ''
        '401':
          description: Sin token JWT, o token inválido o vencido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene rol API, o es Operador API e intenta escribir.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: El registro no existe o no pertenece a la organización del
            usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
